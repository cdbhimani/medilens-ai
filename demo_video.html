<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediLens AI — Official 3-Minute Video Demo Player & Exporter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .title-group h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-group p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .badge {
      background: rgba(20, 184, 166, 0.15);
      color: #2dd4bf;
      border: 1px solid rgba(20, 184, 166, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .player-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.1);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #1f2937;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #14b8a6, #38bdf8);
      border-radius: 4px;
      transition: width 0.1s linear;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button {
      background: #1f2937;
      border: 1px solid #374151;
      color: #f8fafc;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    button:hover {
      background: #374151;
      border-color: #4b5563;
    }
    button.primary {
      background: linear-gradient(135deg, #0d9488, #0284c7);
      border: none;
      color: #fff;
      font-weight: 700;
    }
    button.primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    button.record-btn {
      background: #dc2626;
      border: none;
      color: white;
      font-weight: 700;
    }
    button.record-btn:hover {
      background: #b91c1c;
    }
    button.recording {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .time-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #94a3b8;
    }
    .scene-pill {
      font-size: 11px;
      font-weight: 600;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .scene-list {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .scene-btn {
      font-size: 11px;
      padding: 5px 10px;
      white-space: nowrap;
      background: #1e293b;
      border-color: #334155;
    }
    .scene-btn.active {
      background: rgba(20, 184, 166, 0.2);
      border-color: #14b8a6;
      color: #2dd4bf;
    }
    .subtitles {
      background: rgba(15, 23, 42, 0.9);
      border-left: 3px solid #14b8a6;
      padding: 10px 14px;
      font-size: 12px;
      color: #e2e8f0;
      border-radius: 0 8px 8px 0;
      line-height: 1.5;
      min-height: 48px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title-group">
      <h1>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        MediLens AI — Official Video Demo Player
      </h1>
      <p>Interactive 3.5-Minute Demonstration Walkthrough • Google Cloud AI Builder Cup</p>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="badge">Google Cloud JAPAC</span>
      <button class="record-btn" id="recordBtn" onclick="toggleRecording()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
        <span id="recordText">Export Video (.webm)</span>
      </button>
    </div>
  </div>

  <div class="player-wrapper">
    <canvas id="videoCanvas" width="1280" height="720"></canvas>
  </div>

  <div class="controls">
    <div class="progress-bar-container" onclick="seek(event)">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="control-row">
      <div class="btn-group">
        <button class="primary" id="playBtn" onclick="togglePlay()">
          <svg id="playIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span id="playText">Play Demo</span>
        </button>
        <button onclick="restartDemo()">Restart</button>
        <span class="time-display" id="timeDisplay">00:00 / 03:30</span>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <span class="scene-pill" id="currentSceneBadge">Scene 1: Introduction</span>
        <label style="font-size: 11px; color: #94a3b8; display: flex; align-items: center; gap: 4px; cursor: pointer;">
          <input type="checkbox" id="voiceToggle" checked> Voice Narration
        </label>
      </div>
    </div>

    <div class="scene-list">
      <button class="scene-btn active" onclick="jumpToScene(0)">1. Intro</button>
      <button class="scene-btn" onclick="jumpToScene(1)">2. 1-Click Sample Intake</button>
      <button class="scene-btn" onclick="jumpToScene(2)">3. Deterministic Ranges</button>
      <button class="scene-btn" onclick="jumpToScene(3)">4. MedlinePlus RAG</button>
      <button class="scene-btn" onclick="jumpToScene(4)">5. Doctor Consultation</button>
      <button class="scene-btn" onclick="jumpToScene(5)">6. SI Unit Conversion</button>
      <button class="scene-btn" onclick="jumpToScene(6)">7. Critical Safety Triage</button>
      <button class="scene-btn" onclick="jumpToScene(7)">8. Cloud Run Architecture</button>
    </div>

    <div class="subtitles" id="subtitlesBox">
      Click "Play Demo" to start the synchronized video walkthrough with voice narration.
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('videoCanvas');
  const ctx = canvas.getContext('2d');

  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      const radius = typeof r === 'number' ? r : (Array.isArray(r) ? r[0] : 8);
      this.beginPath();
      this.moveTo(x + radius, y);
      this.arcTo(x + w, y, x + w, y + h, radius);
      this.arcTo(x + w, y + h, x, y + h, radius);
      this.arcTo(x, y + h, x, y, radius);
      this.arcTo(x, y, x + w, y, radius);
      this.closePath();
      return this;
    };
  }
  const playBtn = document.getElementById('playBtn');
  const playText = document.getElementById('playText');
  const playIcon = document.getElementById('playIcon');
  const progressFill = document.getElementById('progressFill');
  const timeDisplay = document.getElementById('timeDisplay');
  const subtitlesBox = document.getElementById('subtitlesBox');
  const currentSceneBadge = document.getElementById('currentSceneBadge');
  const voiceToggle = document.getElementById('voiceToggle');
  const recordBtn = document.getElementById('recordBtn');
  const recordText = document.getElementById('recordText');

  const TOTAL_DURATION = 210; // 3 minutes 30 seconds (210 seconds)
  let currentTime = 0;
  let isPlaying = false;
  let animationId = null;
  let lastTimestamp = 0;
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;

  // 8 Curated Storyboard Scenes
  const SCENES = [
    {
      start: 0,
      end: 25,
      title: "Scene 1: Introduction & Healthcare Literacy Crisis",
      voice: "Welcome to MediLens AI, an intelligent medical report understanding assistant built for the Google Cloud AI Builder Cup. Laboratory reports are filled with abbreviations and reference ranges that cause patient anxiety. MediLens AI bridges this communication gap safely.",
      draw: drawScene1
    },
    {
      start: 25,
      end: 55,
      title: "Scene 2: 1-Click Intake & Multimodal Gemini Extraction",
      voice: "Patients can upload lab documents or test instantly using our 1-click sample report. Google Gemini 1.5 Flash multimodal understanding extracts multi-column biomarker tables, preserving raw values, units, and printed laboratory flags without hallucinating missing data.",
      draw: drawScene2
    },
    {
      start: 55,
      end: 90,
      title: "Scene 3: Deterministic Numerical Range Evaluation",
      voice: "Patient safety requires certainty. MediLens AI uses deterministic application code to evaluate measurements against laboratory intervals. In our sample Complete Blood Count, Hemoglobin is 10.8 g/dL, correctly classified as Below Range without relying on generic LLM guesses.",
      draw: drawScene3
    },
    {
      start: 90,
      end: 125,
      title: "Scene 4: Grounded MedlinePlus & NIH Medical RAG",
      voice: "For every biomarker, our RAG agent retrieves authoritative clinical literature from MedlinePlus and the National Institutes of Health. Explanations translate clinical jargon into plain language with clickable citations and exact literature passages.",
      draw: drawScene4
    },
    {
      start: 125,
      end: 155,
      title: "Scene 5: Doctor Consultation Preparation",
      voice: "MediLens AI never diagnoses disease. Instead, it equips patients with a Doctor Consultation Checklist, suggesting prioritized questions and identifying missing context such as fasting status and current medications that affect results.",
      draw: drawScene5
    },
    {
      start: 155,
      end: 185,
      title: "Scene 6: Longitudinal Trend & Verified Unit Conversions",
      voice: "When comparing reports across dates, clinics often use different units. Our comparison engine applies verified conversion factors, converting Glucose from 5.5 mmol/L to 99.1 mg/dL, calculating safe mathematical deltas with clinically neutral trend descriptions.",
      draw: drawScene6
    },
    {
      start: 185,
      end: 200,
      title: "Scene 7: Clinician-Reviewed Safety Escalation",
      voice: "For critical panic values—such as Potassium at 6.8 mmol/L—our Safety Agent triggers a high-priority clinical alert based on College of American Pathologists consensus rules, directing patients to immediate emergency care.",
      draw: drawScene7
    },
    {
      start: 200,
      end: 210,
      title: "Scene 8: Google Cloud Run & Firebase Architecture",
      voice: "MediLens AI is fully containerized on Google Cloud Run with Firebase Authentication and Cloud Firestore for user-isolated security. With 28 out of 28 passing automated tests, MediLens AI is ready to scale.",
      draw: drawScene8
    }
  ];

  let currentSceneIndex = -1;

  function getCurrentScene(time) {
    return SCENES.findIndex(s => time >= s.start && time < s.end);
  }

  function speakNarration(text) {
    if (!voiceToggle.checked || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1.05;
    utterance.pitch = 1.0;
    const voices = window.speechSynthesis.getVoices();
    const englishVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('David') || v.name.includes('Samantha')));
    if (englishVoice) utterance.voice = englishVoice;
    window.speechSynthesis.speak(utterance);
  }

  function updatePlayer(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    const delta = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;

    if (isPlaying) {
      currentTime += delta;
      if (currentTime >= TOTAL_DURATION) {
        currentTime = TOTAL_DURATION;
        if (isRecording) {
          stopRecording();
        } else {
          pauseDemo();
        }
      }
    }

    const sceneIdx = Math.min(SCENES.length - 1, Math.max(0, getCurrentScene(currentTime)));
    if (sceneIdx !== currentSceneIndex) {
      currentSceneIndex = sceneIdx;
      onSceneChange(sceneIdx);
    }

    // Render current frame
    SCENES[sceneIdx].draw(ctx, currentTime - SCENES[sceneIdx].start, SCENES[sceneIdx].end - SCENES[sceneIdx].start);

    // Update UI elements
    const progressPct = (currentTime / TOTAL_DURATION) * 100;
    progressFill.style.width = `${progressPct}%`;

    const curMin = Math.floor(currentTime / 60).toString().padStart(2, '0');
    const curSec = Math.floor(currentTime % 60).toString().padStart(2, '0');
    timeDisplay.textContent = `${curMin}:${curSec} / 03:30`;

    if (isPlaying) {
      animationId = requestAnimationFrame(updatePlayer);
    }
  }

  function onSceneChange(idx) {
    const scene = SCENES[idx];
    currentSceneBadge.textContent = scene.title;
    subtitlesBox.innerHTML = `<strong>${scene.title}:</strong> ${scene.voice}`;
    
    // Update active scene pill
    const buttons = document.querySelectorAll('.scene-btn');
    buttons.forEach((b, i) => b.classList.toggle('active', i === idx));

    if (isPlaying) {
      speakNarration(scene.voice);
    }
  }

  function togglePlay() {
    if (isPlaying) {
      pauseDemo();
    } else {
      playDemo();
    }
  }

  function playDemo() {
    if (currentTime >= TOTAL_DURATION) currentTime = 0;
    isPlaying = true;
    lastTimestamp = 0;
    playText.textContent = "Pause";
    playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    
    const sceneIdx = Math.max(0, getCurrentScene(currentTime));
    speakNarration(SCENES[sceneIdx].voice);
    animationId = requestAnimationFrame(updatePlayer);
  }

  function pauseDemo() {
    isPlaying = false;
    playText.textContent = "Play Demo";
    playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (animationId) cancelAnimationFrame(animationId);
  }

  function restartDemo() {
    pauseDemo();
    currentTime = 0;
    currentSceneIndex = -1;
    lastTimestamp = 0;
    SCENES[0].draw(ctx, 0, 25);
    progressFill.style.width = '0%';
    timeDisplay.textContent = '00:00 / 03:30';
    playDemo();
  }

  function jumpToScene(idx) {
    currentTime = SCENES[idx].start;
    currentSceneIndex = idx;
    onSceneChange(idx);
    SCENES[idx].draw(ctx, 0, SCENES[idx].end - SCENES[idx].start);
    const progressPct = (currentTime / TOTAL_DURATION) * 100;
    progressFill.style.width = `${progressPct}%`;
    if (!isPlaying) playDemo();
  }

  function seek(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    currentTime = pos * TOTAL_DURATION;
    const sceneIdx = Math.max(0, getCurrentScene(currentTime));
    currentSceneIndex = sceneIdx;
    onSceneChange(sceneIdx);
  }

  // --- DRAWING FUNCTIONS FOR THE 8 SCENES (1280x720 Canvas) ---

  function drawBackground(ctx, title, category) {
    // Gradient dark slate background
    const bg = ctx.createLinearGradient(0, 0, 1280, 720);
    bg.addColorStop(0, '#0f172a');
    bg.addColorStop(1, '#020617');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, 1280, 720);

    // Top Brand Navigation Bar
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, 1280, 70);
    ctx.strokeStyle = '#334155';
    ctx.strokeRect(0, 0, 1280, 70);

    // Logo Emblem
    ctx.fillStyle = '#0d9488';
    ctx.beginPath();
    ctx.roundRect(40, 15, 40, 40, 8);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px Inter';
    ctx.fillText('+', 53, 42);

    // Brand Name
    ctx.font = 'bold 22px Inter';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('MediLens', 92, 42);
    ctx.fillStyle = '#38bdf8';
    ctx.fillText('AI', 188, 42);

    // Top Category Tag
    ctx.fillStyle = '#0f766e';
    ctx.beginPath();
    ctx.roundRect(240, 22, 220, 26, 13);
    ctx.fill();
    ctx.fillStyle = '#ccfbf1';
    ctx.font = 'bold 11px Inter';
    ctx.fillText(category.toUpperCase(), 255, 39);

    // Cloud Run Status Pill
    ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
    ctx.beginPath();
    ctx.roundRect(1020, 20, 220, 30, 15);
    ctx.fill();
    ctx.strokeStyle = '#38bdf8';
    ctx.stroke();
    ctx.fillStyle = '#7dd3fc';
    ctx.font = '600 12px Inter';
    ctx.fillText('● Google Cloud Run Live', 1045, 40);
  }

  // Scene 1: Hero & Introduction
  function drawScene1(ctx, elapsed) {
    drawBackground(ctx, "Introduction", "Healthcare Communication Gap");

    // Hero Box
    ctx.fillStyle = 'rgba(30, 41, 59, 0.6)';
    ctx.beginPath();
    ctx.roundRect(140, 120, 1000, 480, 20);
    ctx.fill();
    ctx.strokeStyle = '#334155';
    ctx.stroke();

    ctx.fillStyle = '#2dd4bf';
    ctx.font = 'bold 14px Inter';
    ctx.fillText('GOOGLE CLOUD AI BUILDER CUP — HEALTHCARE SPECIALIZATION', 380, 175);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 42px Inter';
    ctx.fillText('Understand Your Medical Reports.', 280, 235);
    ctx.fillStyle = '#38bdf8';
    ctx.fillText('Prepare for Better Conversations.', 290, 285);

    ctx.fillStyle = '#94a3b8';
    ctx.font = '16px Inter';
    ctx.fillText('Patients struggle with cryptic abbreviations, units, and intervals in laboratory documents.', 260, 340);
    ctx.fillText('MediLens AI provides grounded educational understanding without diagnostic hallucinations.', 270, 368);

    // Amber 1-Click Sample Button
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.roundRect(320, 420, 320, 56, 14);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px Inter';
    ctx.fillText('⚡ Quick Test with Sample Report', 345, 455);

    // Upload Report Button
    ctx.fillStyle = '#0d9488';
    ctx.beginPath();
    ctx.roundRect(660, 420, 280, 56, 14);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillText('Upload Lab Report (PDF/JPG)', 685, 455);

    // Disclaimer Callout
    ctx.fillStyle = 'rgba(15, 118, 110, 0.2)';
    ctx.beginPath();
    ctx.roundRect(220, 510, 840, 50, 10);
    ctx.fill();
    ctx.strokeStyle = '#0d9488';
    ctx.stroke();
    ctx.fillStyle = '#5eead4';
    ctx.font = '12px Inter';
    ctx.fillText('Clinical Safety Policy: MediLens AI is educational. It does not replace a doctor or recommend medication.', 245, 540);
  }

  // Scene 2: 1-Click Intake
  function drawScene2(ctx, elapsed) {
    drawBackground(ctx, "Multimodal Intake", "Stage 1 & 2: Document Intake & Gemini Multimodal");

    // Left: Document Preview Card
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.roundRect(80, 110, 520, 540, 16);
    ctx.fill();
    ctx.strokeStyle = '#334155';
    ctx.stroke();

    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 16px Inter';
    ctx.fillText('Source Document Intake (Multimodal)', 110, 150);

    // Mock document
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect(110, 175, 460, 440, 8);
    ctx.fill();

    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 14px Inter';
    ctx.fillText('METRO DIAGNOSTIC LABORATORIES', 130, 210);
    ctx.fillStyle = '#64748b';
    ctx.font = '11px Inter';
    ctx.fillText('Specimen: Whole Blood (EDTA)  |  Report Date: 2024-09-15', 130, 230);

    ctx.strokeStyle = '#cbd5e1';
    ctx.strokeRect(130, 250, 420, 1);

    // Table rows
    const rows = [
      ['Hemoglobin', '10.8 g/dL', '12.0 - 15.5', 'L'],
      ['WBC Count', '6.4 10^3/uL', '4.5 - 11.0', 'Normal'],
      ['Hematocrit', '33.2 %', '37.0 - 48.0', 'L'],
      ['Platelet Count', '240 10^3/uL', '150 - 450', 'Normal']
    ];

    rows.forEach((r, i) => {
      ctx.fillStyle = i % 2 === 0 ? '#f8fafc' : '#ffffff';
      ctx.fillRect(130, 270 + i * 45, 420, 40);
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 12px Inter';
      ctx.fillText(r[0], 140, 295 + i * 45);
      ctx.font = '12px Inter';
      ctx.fillText(r[1], 260, 295 + i * 45);
      ctx.fillText(r[2], 370, 295 + i * 45);
      ctx.fillStyle = r[3] === 'L' ? '#b91c1c' : '#15803d';
      ctx.fillText(r[3], 490, 295 + i * 45);
    });

    // Right: 9-Stage Orchestrator Progress
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.roundRect(640, 110, 560, 540, 16);
    ctx.fill();

    ctx.fillStyle = '#2dd4bf';
    ctx.font = 'bold 16px Inter';
    ctx.fillText('9-Stage Agentic Pipeline Execution', 670, 150);

    const stages = [
      'Stage 1: Document Intake & Consent Validation',
      'Stage 2: Gemini 1.5 Flash Multimodal Extraction',
      'Stage 3: Validation Agent & OCR Ambiguity Detection',
      'Stage 4: Deterministic Reference Range Evaluation',
      'Stage 5: MedlinePlus & NIH Evidence Retrieval (RAG)',
      'Stage 6: Grounded Plain-Language Explanation Synthesis',
      'Stage 7: Clinical Safety Triage & Panic Thresholds',
      'Stage 8: Doctor Consultation Preparation',
      'Stage 9: Audited Report Serialization'
    ];

    stages.forEach((s, idx) => {
      const active = (elapsed / 3) > idx;
      ctx.fillStyle = active ? '#14b8a6' : '#475569';
      ctx.beginPath();
      ctx.arc(680, 195 + idx * 45, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = active ? '#f1f5f9' : '#64748b';
      ctx.font = active ? 'bold 13px Inter' : '13px Inter';
      ctx.fillText(s, 705, 200 + idx * 45);
    });
  }

  // Scene 3: Deterministic Ranges
  function drawScene3(ctx, elapsed) {
    drawBackground(ctx, "Range Evaluation", "Stage 4: Deterministic Reference Ranges");

    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.roundRect(80, 110, 1120, 540, 16);
    ctx.fill();

  // --- VIDEO RECORDING / EXPORT FUNCTION ---
  function toggleRecording() {
    if (isRecording) {
      stopRecording();
    } else {
      startRecording();
    }
  }

  function startRecording() {
    isRecording = true;
    recordBtn.classList.add('recording');
    recordText.textContent = 'Recording (Click to Finish & Save)...';
    recordedChunks = [];

    // Capture 30fps stream directly from canvas
    const stream = canvas.captureStream(30);

    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
      ? 'video/webm;codecs=vp9'
      : MediaRecorder.isTypeSupported('video/webm')
      ? 'video/webm'
      : 'video/mp4';

    mediaRecorder = new MediaRecorder(stream, { mimeType: mime });

    mediaRecorder.ondataavailable = function(e) {
      if (e.data && e.data.size > 0) {
        recordedChunks.push(e.data);
      }
    };

    mediaRecorder.onstop = function() {
      const blob = new Blob(recordedChunks, { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'MediLens_AI_3Min_Demo_Video.webm';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }, 100);
      recordBtn.classList.remove('recording');
      recordText.textContent = 'Video Downloaded!';
      setTimeout(() => { recordText.textContent = 'Export Video (.webm)'; }, 4000);
    };

    mediaRecorder.start(1000);
    restartDemo();
  }

  function stopRecording() {
    isRecording = false;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    pauseDemo();
  }
